name: create daily docker image on develop
on:
  push:
    branches:
      - stp-changes
  pull_request:
    branches: [stp-changes]
  workflow_dispatch:
  schedule:
   - cron: "0 2 * * *"
jobs:
  publish-docker-develop-image:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: stp-changes
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USER }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Build the openimis backend Docker image
      id: build
      run: |
         SHA=$(echo ${{ github.sha }} | cut -c1-7)
         docker build . \
           --tag ghcr.io/stssocialst-stp/kenon-backend:${SHA} \
           --tag ghcr.io/stssocialst-stp/kenon-backend:latest
         docker push ghcr.io/stssocialst-stp/kenon-backend:${SHA}
         docker push ghcr.io/stssocialst-stp/kenon-backend:latest
         echo "sha=${SHA}" >> $GITHUB_OUTPUT

  trigger-orchestrator:
    needs: publish-docker-develop-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow in openimis-dist_dkr
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          repository: stssocialst-stp/openimis-dist_dkr
          event-type: deploy-kenon-backend
          client-payload: '{"be_tag": "${{ needs.publish-docker-develop-image.outputs.sha }}"}'